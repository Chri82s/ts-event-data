name: Daily TicketSwap Scraper & Deploy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scraper uitvoeren
        run: python scraper.py

      - name: Wijzigingen committen en pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Automated update: TicketSwap data" || exit 0
          git pull --rebase origin main
          git push
